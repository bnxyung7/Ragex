# ──────────────────────────────────────────────────────────────────────────────
# codemagic.yaml — X
# Bundle ID: com.apple.mobile.MobileHouseArrest
#
# STRATEGY: Build unsigned IPA for iOS device (arm64).
# The IPA is NOT signed by Apple. Sign it afterward with ESign or similar tool.
#
# NO secrets required for the release workflow.
# No provisioning profile, no certificate, no Team ID needed here.
# ──────────────────────────────────────────────────────────────────────────────

workflows:

  # ── Dev: simulator compile check ─────────────────────────────────────────
  x-dev:
    name: X — Dev Compile Check
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
        - pattern: "feature/*"
          include: true

    scripts:
      - name: Xcode version
        script: xcodebuild -version

      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ThreeOneOSFive.xcodeproj \
            -scheme X

      - name: Build (simulator, compile check)
        script: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme X \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | xcpretty

  # ── Simulator: generate .app for iOS Simulator ───────────────────────────
  # Output: X-Simulator.app.zip (for Xcode Simulator on macOS)
  x-simulator:
    name: "X — iOS Simulator Build"
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_SCHEME: "X"
        BUILD_DIR: "$CM_BUILD_DIR/build"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: false
        - pattern: "master"
          include: false
        - pattern: "develop"
          include: true
        - pattern: "simulator"
          include: true
        - pattern: "feature/*"
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Xcode version
        script: xcodebuild -version

      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build for iOS Simulator (x86_64/arm64)
        script: |
          set -o pipefail
          mkdir -p "$BUILD_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | xcpretty

      - name: Locate and package Simulator .app
        script: |
          # Find the simulator build .app (Release-iphonesimulator)
          APP_PATH=$(find "$BUILD_DIR/DerivedData" \
            -path "*/Release-iphonesimulator/X.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: X.app for simulator not found"
            find "$BUILD_DIR/DerivedData" -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found Simulator .app: $APP_PATH"

          # Verify it's a simulator binary (x86_64 or arm64 simulator)
          BINARY="$APP_PATH/X"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            exit 1
          fi
          echo "=== Binary info ==="
          file "$BINARY"

          # Package the .app as a zip for download
          cd "$(dirname "$APP_PATH")"
          zip -qr "$CM_BUILD_DIR/X-Simulator.app.zip" "X.app"
          cd "$CM_BUILD_DIR"

          echo "=== Simulator .app packaged ==="
          ls -lh "$CM_BUILD_DIR/X-Simulator.app.zip"

      - name: Verify Simulator build
        script: |
          ZIP="$CM_BUILD_DIR/X-Simulator.app.zip"
          test -f "$ZIP" || { echo "ERROR: Simulator ZIP not found"; exit 1; }

          echo "=== ZIP contents (first 40 lines) ==="
          unzip -l "$ZIP" | head -40

          echo "=== Verifying X.app/ structure ==="
          unzip -l "$ZIP" | grep "X.app/" \
            || { echo "ERROR: X.app not found in ZIP"; exit 1; }

          echo "=== Simulator build ready ==="
          echo "Download X-Simulator.app.zip"
          echo "Extract and drag X.app to Xcode Simulator"

    artifacts:
      - $CM_BUILD_DIR/X-Simulator.app.zip
      - $CM_BUILD_DIR/**/*.dSYM.zip

  # ── Release: unsigned IPA for iOS device — sign later with ESign ─────────
  # No Apple signing required.
  # Output: X-v3.1.0.ipa  (Payload/X.app)
  # Sign afterward with ESign, Sideloadly, AltStore, or any IPA signer.
  x-release:
    name: X — v3.1.0 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ThreeOneOSFive.xcodeproj
        XCODE_SCHEME: X
        BUILD_DIR: $CM_BUILD_DIR/build
        IPA_DIR: $CM_BUILD_DIR/ipa

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true
        - pattern: "release/*"
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Xcode version
        script: xcodebuild -version

      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build for iOS device (arm64, unsigned)
        script: |
          set -o pipefail
          mkdir -p "$BUILD_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | xcpretty

      - name: Locate .app and package as unsigned IPA
        script: |
          # Find the device build .app (Release-iphoneos, never Simulator)
          APP_PATH=$(find "$BUILD_DIR/DerivedData" \
            -path "*/Release-iphoneos/X.app" -type d | head -1)

          # Fallback: any non-simulator .app
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR/DerivedData" \
              -name "X.app" -type d \
              -not -path "*Simulator*" \
              -not -path "*iphonesimulator*" | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: X.app not found"
            find "$BUILD_DIR/DerivedData" -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP_PATH"

          # Verify binary is arm64 (device, not simulator)
          BINARY="$APP_PATH/X"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            exit 1
          fi
          echo "=== Binary info ==="
          file "$BINARY"
          file "$BINARY" | grep -i "arm64" \
            || { echo "ERROR: Binary does not contain arm64 — not a device build"; exit 1; }

          # Package into unsigned IPA: Payload/X.app inside a ZIP
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/X.app"
          cd "$IPA_DIR"
          zip -qr "$CM_BUILD_DIR/X-v3.1.0.ipa" Payload/
          cd "$CM_BUILD_DIR"

          echo "=== IPA created ==="
          ls -lh "$CM_BUILD_DIR/X-v3.1.0.ipa"

      - name: Verify IPA structure
        script: |
          IPA="$CM_BUILD_DIR/X-v3.1.0.ipa"
          test -f "$IPA" || { echo "ERROR: IPA not found"; exit 1; }

          echo "=== IPA contents (first 40 lines) ==="
          unzip -l "$IPA" | head -40

          echo "=== Verifying Payload/X.app/ exists ==="
          unzip -l "$IPA" | grep "Payload/X.app/" \
            || { echo "ERROR: Payload/X.app not found in IPA"; exit 1; }

          echo "=== Verifying Info.plist inside app ==="
          unzip -l "$IPA" | grep "Payload/X.app/Info.plist" \
            || { echo "WARNING: Info.plist not found directly — may be nested"; }

          echo "=== Checking bundle ID in Info.plist ==="
          unzip -p "$IPA" "Payload/X.app/Info.plist" \
            | plutil -p - | grep -i "CFBundleIdentifier" || true

          echo "=== IPA verified. Ready for ESign. ==="
          echo "Bundle ID: com.apple.mobile.MobileHouseArrest"
          echo "Signing: UNSIGNED — sign with ESign before installing"

    artifacts:
      - $CM_BUILD_DIR/X-v3.1.0.ipa
      - $CM_BUILD_DIR/**/*.dSYM.zip
