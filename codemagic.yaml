# ──────────────────────────────────────────────────────────────────────────────
# codemagic.yaml — ThreeOneOSFive (3105)
# Bundle ID: com.opa334.3105
#
# STRATEGY: Build unsigned IPA for iOS device (arm64).
# The IPA is NOT signed by Apple. Sign it afterward with ESign or similar tool.
#
# NO secrets required for the release workflow.
# No provisioning profile, no certificate, no Team ID needed here.
# ──────────────────────────────────────────────────────────────────────────────

workflows:

  # ── Dev: simulator compile check ─────────────────────────────────────────
  threeoneosfive-dev:
    name: ThreeOneOSFive — Dev Compile Check
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
        - pattern: "feature/*"
          include: true

    scripts:
      - name: Xcode version
        script: xcodebuild -version

      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive

      - name: Build (simulator, compile check)
        script: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | xcpretty

  # ── Release: unsigned IPA for iOS device — sign later with ESign ─────────
  # No Apple signing required.
  # Output: ThreeOneOSFive-unsigned.ipa  (Payload/ThreeOneOSFive.app)
  # Sign afterward with ESign, Sideloadly, AltStore, or any IPA signer.
  threeoneosfive-release:
    name: ThreeOneOSFive — Unsigned IPA (sign with ESign)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ThreeOneOSFive.xcodeproj
        XCODE_SCHEME: ThreeOneOSFive
        BUILD_DIR: $CM_BUILD_DIR/build
        IPA_DIR: $CM_BUILD_DIR/ipa

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true
        - pattern: "release/*"
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Xcode version
        script: xcodebuild -version

      - name: Resolve Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build for iOS device (arm64, unsigned)
        script: |
          set -o pipefail
          mkdir -p "$BUILD_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | xcpretty

      - name: Locate .app and package as unsigned IPA
        script: |
          # Find the device build .app (Release-iphoneos, never Simulator)
          APP_PATH=$(find "$BUILD_DIR/DerivedData" \
            -path "*/Release-iphoneos/ThreeOneOSFive.app" -type d | head -1)

          # Fallback: any non-simulator .app
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR/DerivedData" \
              -name "ThreeOneOSFive.app" -type d \
              -not -path "*Simulator*" \
              -not -path "*iphonesimulator*" | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ThreeOneOSFive.app not found"
            find "$BUILD_DIR/DerivedData" -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP_PATH"

          # Verify binary is arm64 (device, not simulator)
          BINARY="$APP_PATH/ThreeOneOSFive"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            exit 1
          fi
          echo "=== Binary info ==="
          file "$BINARY"
          file "$BINARY" | grep -i "arm64" \
            || { echo "ERROR: Binary does not contain arm64 — not a device build"; exit 1; }

          # Package into unsigned IPA: Payload/ThreeOneOSFive.app inside a ZIP
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/ThreeOneOSFive.app"
          cd "$IPA_DIR"
          zip -qr "$CM_BUILD_DIR/ThreeOneOSFive-unsigned.ipa" Payload/
          cd "$CM_BUILD_DIR"

          echo "=== IPA created ==="
          ls -lh "$CM_BUILD_DIR/ThreeOneOSFive-unsigned.ipa"

      - name: Verify IPA structure
        script: |
          IPA="$CM_BUILD_DIR/ThreeOneOSFive-unsigned.ipa"
          test -f "$IPA" || { echo "ERROR: IPA not found"; exit 1; }

          echo "=== IPA contents (first 40 lines) ==="
          unzip -l "$IPA" | head -40

          echo "=== Verifying Payload/ThreeOneOSFive.app/ exists ==="
          unzip -l "$IPA" | grep "Payload/ThreeOneOSFive.app/" \
            || { echo "ERROR: Payload/ThreeOneOSFive.app not found in IPA"; exit 1; }

          echo "=== Verifying Info.plist inside app ==="
          unzip -l "$IPA" | grep "Payload/ThreeOneOSFive.app/Info.plist" \
            || { echo "WARNING: Info.plist not found directly — may be nested"; }

          echo "=== Checking bundle ID in Info.plist ==="
          unzip -p "$IPA" "Payload/ThreeOneOSFive.app/Info.plist" \
            | plutil -p - | grep -i "CFBundleIdentifier" || true

          echo "=== IPA verified. Ready for ESign. ==="
          echo "Bundle ID: com.opa334.3105"
          echo "Signing: UNSIGNED — sign with ESign before installing"

    artifacts:
      - $CM_BUILD_DIR/ThreeOneOSFive-unsigned.ipa
      - $CM_BUILD_DIR/**/*.dSYM.zip
